<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Páginas</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
        <style>
            * { box-sizing: border-box; }
            body {
                margin: 0;
                font-family: Inter, system-ui, sans-serif;
                background: #f4f7fb;
                color: #111c2a;
            }
            main {
                max-width: 1120px;
                margin: 0 auto;
                padding: 32px 20px 48px;
            }
            h1 {
                margin: 0 0 8px;
                font-size: 28px;
                line-height: 1.2;
            }
            .lead {
                margin: 0 0 28px;
                color: #4b5568;
                font-size: 15px;
            }
            .grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                gap: 16px;
            }
            .card {
                position: relative;
                display: flex;
                flex-direction: column;
                background: #fff;
                border-radius: 14px;
                overflow: hidden;
                color: inherit;
                border: 1px solid #e2e8f2;
                box-shadow: 0 8px 24px rgba(17, 28, 42, 0.06);
                transition: transform 0.15s ease, box-shadow 0.15s ease;
            }
            .card .cover {
                position: absolute;
                inset: 0;
                z-index: 2;
            }
            .card:hover {
                transform: translateY(-2px);
                box-shadow: 0 12px 28px rgba(17, 28, 42, 0.1);
            }
            .preview {
                position: relative;
                aspect-ratio: 16 / 10;
                overflow: hidden;
                background: #e8eef6;
                pointer-events: none;
            }
            .preview iframe {
                position: absolute;
                top: 0;
                left: 0;
                width: 400%;
                height: 400%;
                border: 0;
                transform: scale(0.25);
                transform-origin: top left;
            }
            .meta {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
                padding: 12px 14px;
            }
            .meta strong {
                font-size: 14px;
            }
            .meta span {
                font-size: 12px;
                color: #6b7280;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>Páginas</h1>
            <p class="lead">Escolha uma página para abrir.</p>
            <div class="grid">
                <article class="card">
                    <div class="preview">
                        <iframe src="jabatec01.html" title="Prévia da Jabatec 1" loading="lazy" tabindex="-1"></iframe>
                    </div>
                    <div class="meta">
                        <strong>Jabatec 1</strong>
                        <span>jabatec01.html</span>
                    </div>
                    <a class="cover" href="jabatec01.html" aria-label="Abrir Jabatec 1"></a>
                </article>
                <article class="card">
                    <div class="preview">
                        <iframe src="jabatec02.html" title="Prévia da Jabatec 2" loading="lazy" tabindex="-1"></iframe>
                    </div>
                    <div class="meta">
                        <strong>Jabatec 2</strong>
                        <span>jabatec02.html</span>
                    </div>
                    <a class="cover" href="jabatec02.html" aria-label="Abrir Jabatec 2"></a>
                </article>
                <article class="card">
                    <div class="preview">
                        <iframe src="jabatec03.html" title="Prévia da Jabatec 3" loading="lazy" tabindex="-1"></iframe>
                    </div>
                    <div class="meta">
                        <strong>Jabatec 3</strong>
                        <span>jabatec03.html</span>
                    </div>
                    <a class="cover" href="jabatec03.html" aria-label="Abrir Jabatec 3"></a>
                </article>
            </div>
        </main>
        <script src="site-nav.js"></script>
    </body>
</html>
